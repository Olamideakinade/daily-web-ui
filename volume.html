<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volume Control - Apple in 2030</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #191c26 0%, #090a0f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
      transition: background 0.5s ease;
    }

    body.overdrive-mode {
      background: radial-gradient(circle at 50% 50%, #331518 0%, #11090c 65%, #070709 100%);
    }

    /* Ambient Glow Behind iPhone */
    .ambient-bloom {
      position: fixed;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(100, 210, 255, 0.2) 0%,
        rgba(94, 92, 230, 0.1) 45%,
        transparent 70%
      );
      filter: blur(28px);
      pointer-events: none;
      transition: all 0.4s ease;
      z-index: 0;
    }

    body.overdrive-mode .ambient-bloom {
      background: radial-gradient(
        circle,
        rgba(255, 69, 58, 0.32) 0%,
        rgba(255, 159, 10, 0.14) 45%,
        transparent 70%
      );
      transform: scale(1.1);
    }

    /* Outer iPhone Titanium Chassis */
    .iphone-frame {
      position: relative;
      width: 354px;
      height: 728px;
      border-radius: 58px;
      padding: 11px;
      background: linear-gradient(145deg, #5a5a60 0%, #2d2d30 48%, #47474d 100%);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.82),
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 0 0 2px #141416;
      transition:
        box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
    }

    .iphone-frame.taptic-bump {
      transform: scale(0.992);
    }

    .iphone-frame.bass-shake {
      animation: bassShake 0.18s ease-in-out infinite;
    }

    @keyframes bassShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1.5px, -1px); }
    }

    /* Hardware Side Buttons */
    .hw-btn {
      position: absolute;
      background: linear-gradient(180deg, #4b4b50, #2a2a2e);
      border-radius: 2px;
      box-shadow: 0 0 1px rgba(255, 255, 255, 0.25) inset;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .hw-action {
      left: -3px;
      top: 132px;
      width: 3px;
      height: 28px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }
    .hw-vol-up {
      left: -3px;
      top: 180px;
      width: 3px;
      height: 52px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }
    .hw-vol-down {
      left: -3px;
      top: 244px;
      width: 3px;
      height: 52px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }
    .hw-power {
      right: -3px;
      top: 200px;
      width: 3px;
      height: 78px;
      border-top-right-radius: 3px;
      border-bottom-right-radius: 3px;
    }

    /* Inner Black Hardware Bezel */
    .iphone-bezel {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 48px;
      padding: 3px;
      overflow: hidden;
    }

    .earpiece-slit {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 3px;
      border-radius: 2px;
      background: #141416;
      z-index: 30;
    }

    /* Screen Area - iOS Control Center Frosted Wallpaper */
    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 45px;
      background:
        radial-gradient(circle at 22% 20%, rgba(94, 92, 230, 0.42) 0%, transparent 48%),
        radial-gradient(circle at 80% 72%, rgba(50, 173, 230, 0.35) 0%, transparent 52%),
        radial-gradient(circle at 50% 50%, #141722 0%, #090a10 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.4s ease;
    }

    /* Persistent Status Bar & Dynamic Island */
    .status-bar {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 24px;
      z-index: 45;
      color: #ffffff;
    }

    .status-time {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      width: 54px;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: relative;
      width: 152px;
      height: 28px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: width 0.35s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    .island-left {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #64d2ff;
    }

    .island-left svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .island-wave {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 11px;
      margin-left: auto;
      margin-right: 6px;
    }

    .wave-bar {
      width: 2px;
      background: #64d2ff;
      border-radius: 2px;
      height: 4px;
      transition: height 0.15s ease, background 0.2s ease;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 54px;
      justify-content: flex-end;
    }

    .status-icons svg {
      height: 11px;
      fill: currentColor;
    }

    /* Main Content Layer */
    .screen-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 58px 20px 22px;
      transition: filter 0.35s ease;
      z-index: 2;
    }

    .iphone-screen.blurred .screen-content {
      filter: blur(10px);
    }

    /* Header Info */
    .header-area {
      text-align: center;
    }

    .vol-readout {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1.2px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      margin-bottom: 4px;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .vol-readout.danger {
      color: #ff453a;
      text-shadow: 0 0 18px rgba(255, 69, 58, 0.55);
    }

    .vol-subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(235, 235, 245, 0.65);
      letter-spacing: -0.1px;
      min-height: 18px;
    }

    /* Segmented Bad-UI Mode Switcher */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: rgba(118, 118, 128, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 3px;
      border-radius: 12px;
      width: 100%;
      max-width: 288px;
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.12) inset;
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 7px 4px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Center iOS Control Center Volume Pill Stage */
    .volume-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      my: auto;
    }

    .volume-pill-container {
      position: relative;
      width: 112px;
      height: 276px;
      border-radius: 36px;
      background: rgba(35, 35, 42, 0.72);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.14) inset;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.22, 1.4, 0.36, 1), box-shadow 0.3s ease;
    }

    .volume-pill-container.overdrive {
      box-shadow:
        0 18px 50px rgba(255, 69, 58, 0.45),
        0 0 0 1.5px rgba(255, 69, 58, 0.6) inset;
    }

    /* White Liquid Fill Bar */
    .volume-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #ffffff 0%, #e5e5ea 100%);
      transition: height 0.12s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease;
      position: relative;
    }

    .volume-pill-container.overdrive .volume-fill {
      background: linear-gradient(180deg, #ff453a 0%, #ff9f0a 100%);
    }

    /* Air Leak Bubbles in Pump Mode */
    .leak-indicator {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.32);
      padding: 3px 8px;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }

    .leak-indicator.visible {
      opacity: 1;
    }

    /* Speaker Icon Inside Pill */
    .pill-speaker-icon {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      color: #8e8e93;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 5;
    }

    /* Slingshot Pull Handle (Mode 3) */
    .slingshot-cord {
      display: none;
      position: absolute;
      bottom: -8px;
      width: 4px;
      height: 0px;
      background: #ff9f0a;
      border-radius: 2px;
      z-index: 10;
    }

    /* Interactive Action Dock Below Pill */
    .action-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
    }

    .action-btn {
      height: 46px;
      padding: 0 20px;
      border-radius: 23px;
      border: none;
      background: linear-gradient(180deg, #3478f6 0%, #007aff 100%);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow:
        0 8px 20px rgba(0, 122, 255, 0.38),
        0 1px 1px rgba(255, 255, 255, 0.3) inset;
      transition: transform 0.12s cubic-bezier(0.22, 1.4, 0.36, 1), background 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.93);
    }

    .action-btn.pump-btn {
      background: linear-gradient(180deg, #30d158 0%, #248a3d 100%);
      box-shadow:
        0 8px 20px rgba(48, 209, 88, 0.35),
        0 1px 1px rgba(255, 255, 255, 0.3) inset;
    }

    .action-btn.dice-btn {
      background: linear-gradient(180deg, #bf5af2 0%, #8944ab 100%);
      box-shadow:
        0 8px 20px rgba(191, 90, 242, 0.35),
        0 1px 1px rgba(255, 255, 255, 0.3) inset;
    }

    .action-btn.mute-paywall-btn {
      background: rgba(118, 118, 128, 0.34);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.16) inset;
      padding: 0 15px;
    }

    /* 3D Dice Overlay inside Pill for Dice Mode */
    .dice-pair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 6;
      pointer-events: none;
    }

    .dice-pair.visible {
      display: flex;
    }

    .die-cube {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.4),
        0 -2px 0 #d1d1d6 inset;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #1c1c1e;
    }

    .dice-pair.rolling .die-cube {
      animation: dieRollSpin 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    }

    @keyframes dieRollSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(0.86); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .home-indicator {
      width: 120px;
      height: 4.5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.38);
      margin-top: 4px;
    }

    /* Overlay Backdrop inside Phone */
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.24);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .overlay-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* iOS Alert Modal ("Volume Pro™") */
    .ios-alert {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 278px;
      transform: translate(-50%, -50%) scale(0.84);
      background: rgba(38, 38, 42, 0.9);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-radius: 16px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 0 0.5px rgba(255, 255, 255, 0.16) inset;
      color: #ffffff;
      text-align: center;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transition:
        opacity 0.2s ease,
        transform 0.28s cubic-bezier(0.22, 1.22, 0.36, 1);
    }

    .ios-alert.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .alert-body {
      padding: 20px 18px 17px;
    }

    .alert-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .alert-message {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.38;
      letter-spacing: -0.1px;
      color: rgba(235, 235, 245, 0.9);
    }

    .alert-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 0.5px solid rgba(255, 255, 255, 0.18);
      height: 44px;
    }

    .alert-btn {
      background: transparent;
      border: none;
      color: #0a84ff;
      font-size: 16.5px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease;
    }

    .alert-btn:first-child {
      border-right: 0.5px solid rgba(255, 255, 255, 0.18);
      font-weight: 400;
    }

    .alert-btn:last-child {
      font-weight: 600;
    }

    .alert-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Apple Pay Bottom Sheet */
    .apple-pay-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(28, 28, 30, 0.96);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 8px 18px 24px;
      color: #ffffff;
      z-index: 40;
      transform: translateY(104%);
      box-shadow:
        0 -10px 35px rgba(0, 0, 0, 0.48),
        0 0.5px 0 rgba(255, 255, 255, 0.16) inset;
      transition: transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .apple-pay-sheet.visible {
      transform: translateY(0%);
    }

    .sheet-grabber {
      width: 36px;
      height: 4.5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.28);
      margin: 0 auto 12px;
    }

    .pay-details-view.hidden {
      display: none;
    }

    .apple-pay-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 16px;
    }

    .apple-pay-header svg {
      width: 16px;
      height: 19px;
      fill: #ffffff;
      transform: translateY(-1px);
    }

    .subscription-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .sub-info-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .sub-info-desc {
      font-size: 12px;
      color: #8e8e93;
    }

    .sub-price {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #ffffff;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(58, 58, 62, 0.76);
      border-radius: 12px;
      padding: 11px 13px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .mastercard-logo {
      position: relative;
      width: 30px;
      height: 20px;
      display: flex;
      align-items: center;
    }

    .mc-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      position: absolute;
    }

    .mc-red { background: #eb001b; left: 0; }
    .mc-orange { background: #f79e1b; left: 11px; mix-blend-mode: screen; opacity: 0.92; }

    .card-name {
      font-size: 13.5px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 1px;
    }

    .card-number {
      font-size: 11.5px;
      color: #98989f;
      letter-spacing: 0.4px;
    }

    .card-chevron {
      color: #8e8e93;
      font-size: 18px;
      font-weight: 500;
    }

    .pay-footer {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 23px;
      background: #007aff;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35);
    }

    .face-id-box {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 2px 0;
      color: #ffffff;
      transition: color 0.25s ease;
    }

    .face-id-box.active {
      display: flex;
      animation: fadeInScale 0.22s ease;
    }

    .face-id-box.verified {
      color: #30d158;
    }

    .face-id-icon-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .face-scan-laser {
      position: absolute;
      left: 3px;
      right: 3px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #64d2ff, #ffffff, #64d2ff, transparent);
      box-shadow: 0 0 8px #64d2ff;
      border-radius: 2px;
      opacity: 0;
    }

    .face-id-box.scanning .face-scan-laser {
      opacity: 0.95;
      animation: laserSweep 0.75s ease-in-out infinite alternate;
    }

    @keyframes laserSweep {
      0% { top: 5px; }
      100% { top: 28px; }
    }

    .face-id-icon {
      width: 34px;
      height: 34px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .face-id-label {
      font-size: 12px;
      font-weight: 600;
    }

    .pay-done-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 0 22px;
      gap: 10px;
      animation: fadeInScale 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pay-done-view.active {
      display: flex;
    }

    .done-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid #30d158;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #30d158;
      box-shadow: 0 0 18px rgba(48, 209, 88, 0.3);
    }

    .done-circle svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: drawCheck 0.35s 0.06s ease forwards;
    }

    .done-text {
      font-size: 16px;

  <script>
    const iphoneFrame = document.getElementById('iphoneFrame');
    const iphoneScreen = document.getElementById('iphoneScreen');
    const islandVolText = document.getElementById('islandVolText');
    const islandWave = document.getElementById('islandWave');
    const volReadout = document.getElementById('volReadout');
    const volSubtitle = document.getElementById('volSubtitle');
    const volumePill = document.getElementById('volumePill');
    const volumeFill = document.getElementById('volumeFill');
    const leakBadge = document.getElementById('leakBadge');
    const dicePair = document.getElementById('dicePair');
    const die1 = document.getElementById('die1');
    const die2 = document.getElementById('die2');
    const primaryActionBtn = document.getElementById('primaryActionBtn');
    const lockVolBtn = document.getElementById('lockVolBtn');
    const modeTabs = document.querySelectorAll('.mode-tab');

    const overlayBackdrop = document.getElementById('overlayBackdrop');
    const proAlert = document.getElementById('proAlert');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');
    const cancelBtn = document.getElementById('cancelBtn');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const applePaySheet = document.getElementById('applePaySheet');
    const payDetailsView = document.getElementById('payDetailsView');
    const subTitle = document.getElementById('subTitle');
    const subDesc = document.getElementById('subDesc');
    const subPrice = document.getElementById('subPrice');
    const cardRow = document.getElementById('cardRow');
    const cardName = document.getElementById('cardName');
    const cardNumber = document.getElementById('cardNumber');
    const confirmFaceIdBtn = document.getElementById('confirmFaceIdBtn');
    const faceIdBox = document.getElementById('faceIdBox');
    const payDoneView = document.getElementById('payDoneView');

    let currentMode = 'pump'; // 'pump' | 'dice' | 'slingshot'
    let volume = 38;
    let isLeakSealed = false;
    let isFlowBusy = false;

    /* ==========================================================================
       Synthesized Web Audio Sound Engine
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;

      function getCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function triggerTapticBump() {
        iphoneFrame.classList.remove('taptic-bump');
        void iphoneFrame.offsetWidth;
        iphoneFrame.classList.add('taptic-bump');
        setTimeout(() => iphoneFrame.classList.remove('taptic-bump'), 110);
      }

      // Bicycle Air Pump Puff + Pitch-Scaled Pop
      function playPumpPuff(currentVol) {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;

          // Air puff noise burst
          const bufSize = c.sampleRate * 0.14;
          const buf = c.createBuffer(1, bufSize, c.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = c.createBufferSource();
          noise.buffer = buf;

          const filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(500 + currentVol * 12, now);
          filter.Q.value = 2.2;

          const gain = c.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(c.destination);
          noise.start(now);

          // Pitch-rising rubber inflation bloop
          const osc = c.createOscillator();
          const oGain = c.createGain();
          osc.type = 'sine';
          const baseFreq = 180 + currentVol * 4.5;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, now + 0.09);
          oGain.gain.setValueAtTime(0.08, now);
          oGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
          osc.connect(oGain);
          oGain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        } catch (e) {}
      }

      // Dice Rattle & Clack
      function playDiceRattle() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          for (let i = 0; i < 6; i++) {
            const t = now + i * 0.075;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(750 + Math.random() * 650, t);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.035);
            gain.gain.setValueAtTime(0.16, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.045);
          }
        } catch (e) {}
      }

      // Slingshot Rubber Stretch & Boing Launch
      function playSlingshotLaunch(overdrive = false) {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;

          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = overdrive ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(overdrive ? 1480 : 780, now + 0.28);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.34);
        } catch (e) {}
      }

      function playAlertPop() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          [
            { f: 587.33, d: 0.0, dur: 0.16 },
            { f: 880.0, d: 0.045, dur: 0.24 }
          ].forEach(({ f, d, dur }) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + d);
            gain.gain.setValueAtTime(0.0001, now + d);
            gain.gain.linearRampToValueAtTime(0.12, now + d + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + d + dur);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now + d);
            osc.stop(now + d + dur + 0.01);
          });
        } catch (e) {}
      }

      function playTap(pitch = 150) {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(pitch, now);
          osc.frequency.exponentialRampToValueAtTime(48, now + 0.03);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } catch (e) {}
      }

      function playSheetSlideUp() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const bufferSize = c.sampleRate * 0.22;
          const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = c.createBufferSource();
          noise.buffer = buffer;
          const filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(1450, now + 0.2);
          const gain = c.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.07, now + 0.07);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.21);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(c.destination);
          noise.start(now);
        } catch (e) {}
      }

      function playFaceIdScan() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          [660, 880, 1108.73].forEach((f, idx) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            const start = now + idx * 0.18;
            osc.frequency.setValueAtTime(f, start);
            osc.frequency.exponentialRampToValueAtTime(f * 1.06, start + 0.16);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(0.045, start + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.19);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(start);
            osc.stop(start + 0.2);
          });
        } catch (e) {}
      }

      function playFaceIdVerified() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1046.5, now);
          osc.frequency.setValueAtTime(1396.9, now + 0.045);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      }

      function playApplePayChime() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const playBellNote = (freq, start, duration, peakGain) => {
            [
              { ratio: 1, weight: 1.0, decay: duration },
              { ratio: 2, weight: 0.32, decay: duration * 0.65 },
              { ratio: 3, weight: 0.12, decay: duration * 0.4 }
            ].forEach(({ ratio, weight, decay }) => {
              const osc = c.createOscillator();
              const gain = c.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq * ratio, start);
              gain.gain.setValueAtTime(0.0001, start);
              gain.gain.linearRampToValueAtTime(peakGain * weight, start + 0.012);
              gain.gain.exponentialRampToValueAtTime(0.0001, start + decay);
              osc.connect(gain);
              gain.connect(c.destination);
              osc.start(start);
              osc.stop(start + decay + 0.02);
            });
          };
          playBellNote(987.77, now, 0.36, 0.18);
          playBellNote(1318.51, now + 0.115, 0.85, 0.22);
        } catch (e) {}
      }

      return {
        playPumpPuff,
        playDiceRattle,
        playSlingshotLaunch,
        playAlertPop,
        playTap,
        playSheetSlideUp,
        playFaceIdScan,
        playFaceIdVerified,
        playApplePayChime
      };
    })();

    /* ==========================================================================
       Volume Physics & UI Updates
       ========================================================================== */
    function updateVolumeUI() {
      const clampedBar = Math.max(0, Math.min(100, volume));
      const displayVal = Math.round(volume);
      volumeFill.style.height = `${clampedBar}%`;
      volReadout.textContent = `${displayVal}%`;
      islandVolText.textContent = `${displayVal}%`;

      // Animate Dynamic Island waveform bars proportional to volume
      const bars = islandWave.querySelectorAll('.wave-bar');
      bars.forEach((b, i) => {
        const h = Math.max(3, Math.min(13, (clampedBar / 100) * 12 * (0.6 + (i % 2) * 0.4)));
        b.style.height = `${h}px`;
        b.style.background = displayVal > 100 ? '#ff453a' : '#64d2ff';
      });

      if (displayVal > 100) {
        volReadout.classList.add('danger');
        volumePill.classList.add('overdrive');
        document.body.classList.add('overdrive-mode');
        iphoneFrame.classList.add('bass-shake');
      } else {
        volReadout.classList.remove('danger');
        volumePill.classList.remove('overdrive');
        document.body.classList.remove('overdrive-mode');
        iphoneFrame.classList.remove('bass-shake');
      }
    }

    // Gravity / Air Pressure Leak Loop in Pump Mode
    setInterval(() => {
      if (currentMode === 'pump' && !isLeakSealed && !isFlowBusy && volume > 0) {
        volume = Math.max(0, volume - 0.55);
        updateVolumeUI();
      }
    }, 100);

    // Switch Modes
    modeTabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        if (isFlowBusy) return;
        SoundFX.playTap(175);
        modeTabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;

        iphoneFrame.classList.remove('bass-shake');
        isLeakSealed = false;

        if (currentMode === 'pump') {
          volume = 38;
          leakBadge.classList.add('visible');
          leakBadge.textContent = '💨 Leaking -5%/s';
          dicePair.classList.remove('visible');
          primaryActionBtn.className = 'action-btn pump-btn';
          primaryActionBtn.innerHTML = '<span>💨 Pump Volume</span>';
          volSubtitle.textContent = 'Air pressure leaking... pump fast!';
        } else if (currentMode === 'dice') {
          volume = 47;
          leakBadge.classList.remove('visible');
          dicePair.classList.add('visible');
          primaryActionBtn.className = 'action-btn dice-btn';
          primaryActionBtn.innerHTML = '<span>🎲 Roll Volume</span>';
          volSubtitle.textContent = 'Roll 2D10 to gamble your volume';
        } else if (currentMode === 'slingshot') {
          volume = 25;
          leakBadge.classList.add('visible');
          leakBadge.textContent = '🎯 Pull & Launch';
          dicePair.classList.remove('visible');
          primaryActionBtn.className = 'action-btn';
          primaryActionBtn.innerHTML = '<span>🎯 Launch Catapult</span>';
          volSubtitle.textContent = 'Warning: Do not overshoot 100%';
        }
        updateVolumeUI();
      });
    });

    // Primary Action Button or Clicking Pill
    function triggerPrimaryMechanic() {
      if (isFlowBusy) return;

      if (currentMode === 'pump') {
        volume = Math.min(100, volume + 16);
        SoundFX.playPumpPuff(volume);
        volumePill.style.transform = 'scaleX(1.05) scaleY(0.97)';
        setTimeout(() => (volumePill.style.transform = ''), 120);
        updateVolumeUI();

        if (volume >= 98) {
          volSubtitle.textContent = 'Max pressure! Buy Valve Seal before it leaks!';
        }
      } else if (currentMode === 'dice') {
        SoundFX.playDiceRattle();
        dicePair.classList.add('rolling');
        volSubtitle.textContent = 'Rolling volume dice...';

        let ticks = 0;
        const rollTimer = setInterval(() => {
          die1.textContent = Math.floor(Math.random() * 10);
          die2.textContent = Math.floor(Math.random() * 10);
          ticks++;
          if (ticks >= 7) {
            clearInterval(rollTimer);
            dicePair.classList.remove('rolling');
            const d1 = Math.floor(Math.random() * 10);
            const d2 = Math.floor(Math.random() * 10);
            die1.textContent = d1;
            die2.textContent = d2;
            const rolledVol = d1 * 10 + d2;
            volume = rolledVol === 0 ? 100 : rolledVol;
            updateVolumeUI();
            volSubtitle.textContent = `Rolled ${d1} & ${d2} → Volume set to ${volume}%!`;
          }
        }, 65);
      } else if (currentMode === 'slingshot') {
        // Pull down to 5%, then catapult past 100% to 184% (Speaker Blown!)
        SoundFX.playTap(110);
        volume = 6;
        updateVolumeUI();
        volumePill.style.transform = 'translateY(14px) scaleY(0.9)';
        volSubtitle.textContent = 'Pulling catapult tension...';

        setTimeout(() => {
          volumePill.style.transform = 'translateY(-8px) scaleY(1.06)';
          SoundFX.playSlingshotLaunch(true);
          volume = 184;
          updateVolumeUI();
          volSubtitle.textContent = '⚠️ 184% OVERDRIVE — Speaker Blown!';

          setTimeout(() => {
            volumePill.style.transform = '';
            openPaywallAlert({
              title: 'Speaker Blown™',
              message: 'Catapulting volume to 184% ruptured your virtual tweeter. Purchase Instant Acoustic Repair to restore normal audio.',
              itemTitle: 'AppleCare+ Audio™',
              itemDesc: 'Emergency Decibel & Speaker Fix',
              price: '$29.99'
            });
          }, 680);
        }, 380);
      }
    }

    primaryActionBtn.addEventListener('click', triggerPrimaryMechanic);
    volumePill.addEventListener('click', triggerPrimaryMechanic);

    // Clicking "Lock / Mute" or Hardware Volume Buttons triggers the Volume Pro™ Paywall!
    function triggerVolumePaywall() {
      if (isFlowBusy) return;
      openPaywallAlert({
        title: 'Volume Pro™',
        message: 'Locking air pressure or muting audio requires an iCloud Volume+ Subscription. Please complete the purchase to continue.',
        itemTitle: 'Volume Pro™',
        itemDesc: 'iCloud Valve Seal & Mute Pass',
        price: '$12.99'
      });
    }

    lockVolBtn.addEventListener('click', triggerVolumePaywall);
    document.getElementById('hwVolUp').addEventListener('click', triggerVolumePaywall);
    document.getElementById('hwVolDown').addEventListener('click', triggerVolumePaywall);

    function openPaywallAlert({ title, message, itemTitle, itemDesc, price }) {
      alertTitle.textContent = title;
      alertMessage.textContent = message;
      subTitle.textContent = itemTitle;
      subDesc.textContent = itemDesc;
      subPrice.textContent = price;

      iphoneFrame.classList.remove('bass-shake');
      iphoneScreen.classList.add('blurred');
      overlayBackdrop.classList.add('active');
      proAlert.classList.add('visible');
      SoundFX.playAlertPop();
    }

    // Cancel Button
    cancelBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      SoundFX.playTap(110);
      proAlert.classList.remove('visible');
      iphoneScreen.classList.remove('blurred');
      overlayBackdrop.classList.remove('active');
      if (volume > 100) iphoneFrame.classList.add('bass-shake');
    });

    // Subscribe Button -> Apple Pay Sheet
    subscribeBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      SoundFX.playTap(170);
      proAlert.classList.remove('visible');

      payDetailsView.classList.remove('hidden');
      confirmFaceIdBtn.style.display = 'block';
      faceIdBox.classList.remove('active', 'scanning', 'verified');
      payDoneView.classList.remove('active');

      setTimeout(() => {
        applePaySheet.classList.add('visible');
        SoundFX.playSheetSlideUp();
      }, 120);
    });

    // Cycle Cards
    const cards = [
      { name: 'Mastercard', number: '•••• 8924' },
      { name: 'Apple Audio+ Card', number: '•••• 2030' },
      { name: 'Kidney Pay™', number: '•••• 0001' }
    ];
    let currentCardIdx = 0;
    cardRow.addEventListener('click', () => {
      if (isFlowBusy) return;
      SoundFX.playTap(180);
      currentCardIdx = (currentCardIdx + 1) % cards.length;
      cardName.textContent = cards[currentCardIdx].name;
      cardNumber.textContent = cards[currentCardIdx].number;
    });

    // Confirm with Face ID
    confirmFaceIdBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      isFlowBusy = true;

      confirmFaceIdBtn.style.display = 'none';
      faceIdBox.classList.add('active', 'scanning');
      SoundFX.playFaceIdScan();

      setTimeout(() => {
        faceIdBox.classList.remove('scanning');
        faceIdBox.classList.add('verified');
        SoundFX.playFaceIdVerified();
      }, 950);

      setTimeout(() => {
        payDetailsView.classList.add('hidden');
        payDoneView.classList.add('active');
        SoundFX.playApplePayChime();
      }, 1650);

      setTimeout(() => {
        applePaySheet.classList.remove('visible');
        iphoneScreen.classList.remove('blurred');
        overlayBackdrop.classList.remove('active');

        // Apply purchased fix!
        isLeakSealed = true;
        volume = 50;
        leakBadge.textContent = '✅ Valve Sealed (50%)';
        volSubtitle.textContent = 'Volume Pro™ Active — Decibels Stabilized';
        updateVolumeUI();
        isFlowBusy = false;
      }, 2800);
    });
  </script>
</body>
</html>
