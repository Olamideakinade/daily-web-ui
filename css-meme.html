<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome back — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* =================================================================
     * Base theme variables (Hover Line 24 to open the Color Picker!)
     * Press Cmd + S after changing a color to trigger the layout chaos!
     * =================================================================
     */
    :root {
      --bg: #0f172a;          /* slate-900 */
      --bg-accent: #111827;   /* gray-900 */
      --card: rgba(59, 130, 246, 0.08);
      --text: #e5e7eb;        /* gray-200 */
      --muted: #9ca3af;       /* gray-400 */
      --brand: #3b82f6;       /* blue-500 */
      --brand-strong: #2563eb;/* blue-600 */
      --ring: rgba(59,130,246,0.6);
      --error: #ef4444;
      --surface: rgba(17,24,39,0.4);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;        /* slate-100 */
        --bg-accent: #e2e8f0; /* slate-200 */
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Clean Login Card (Matches the viral TikTok video 1:1) */
    .login-card {
      width: 390px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 22px;
      padding: 34px 30px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.04);
      position: relative;
      transform-origin: center center;
    }

    .brand-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 22px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      text-align: center;
      color: #0f172a;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      padding: 0 13px;
      font-size: 13.5px;
      color: #0f172a;
      outline: none;
    }

    .show-btn {
      position: absolute;
      right: 8px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 18px;
      font-size: 12.5px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #475569;
      font-weight: 500;
    }

    .forgot-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .signin-btn {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    .divider {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin: 16px 0;
    }

    .social-btn {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
    }

    .footer-note a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    /* ==========================================================================
       THE VIRAL CSS CURSE ANIMATIONS (Triggered on Cmd+S Save or Pressing Z!)
       ========================================================================== */

    /* 1. HELICOPTER SPIN + WARP DISFIGUREMENT (Exact match to the TikTok video!) */
    body.chaos-spin .login-card {
      animation: helicopterChaos 0.42s linear infinite;
    }

    body.chaos-spin .signin-btn {
      animation: buttonStretchChaos 0.35s ease-in-out infinite alternate;
    }

    body.chaos-spin .brand-badge {
      animation: badgeOrbitChaos 0.28s linear infinite;
    }

    @keyframes helicopterChaos {
      0%   { transform: rotate(0deg) scale(1, 1) skew(0deg, 0deg); }
      25%  { transform: rotate(90deg) scale(1.18, 0.82) skew(14deg, -8deg); }
      50%  { transform: rotate(180deg) scale(0.85, 1.22) skew(-18deg, 12deg); }
      75%  { transform: rotate(270deg) scale(1.25, 0.78) skew(10deg, -15deg); }
      100% { transform: rotate(360deg) scale(1, 1) skew(0deg, 0deg); }
    }

    @keyframes buttonStretchChaos {
      0%   { transform: scaleX(1.0) scaleY(1.0) rotate(0deg); }
      100% { transform: scaleX(1.35) scaleY(1.65) rotate(-12deg); background: #1d4ed8; }
    }

    @keyframes badgeOrbitChaos {
      0%   { transform: scale(1) translate(0, 0); }
      50%  { transform: scale(2.4) translate(25px, -18px); }
      100% { transform: scale(1) translate(0, 0); }
    }

    /* 2. EXPLODED STRETCH DISFIGUREMENT (Press 2 to switch style) */
    body.chaos-disfigure .login-card {
      width: 680px;
      height: 190px;
      border-radius: 140px 0 90px 0;
      transform: rotate(-19deg) skewX(28deg);
      border: 6px dashed #ef4444;
    }
    body.chaos-disfigure .brand-badge {
      width: 420px;
      height: 310px;
      font-size: 160px;
      position: absolute;
      top: -150px;
      left: 40px;
      opacity: 0.9;
      transform: rotate(35deg);
    }
    body.chaos-disfigure .signin-btn {
      position: fixed;
      top: -40px;
      right: -30px;
      width: 95px;
      height: 520px;
      transform: rotate(-145deg) scale(1.8);
      font-size: 38px;
    }
    body.chaos-disfigure .text-input {
      width: 750px;
      transform: rotate(32deg) translate(-120px, 40px);
      background: #fde047;
    }
  </style>
</head>
<body>

  <div class="login-card" id="loginCard">
    <div class="brand-badge">👋</div>
    <h1 class="card-title">Welcome back</h1>
    <p class="card-subtitle">Please sign in to continue</p>

    <div class="form-field">
      <label class="field-label">Email</label>
      <div class="input-wrap">
        <input type="email" class="text-input" value="you@example.com" readonly />
      </div>
    </div>

    <div class="form-field">
      <label class="field-label">Password</label>
      <div class="input-wrap">
        <input type="password" class="text-input" value="••••••••" readonly />
        <button class="show-btn" type="button">Show</button>
      </div>
    </div>

    <div class="meta-row">
      <label class="remember-label">
        <input type="checkbox" />
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button class="signin-btn" type="button" id="signInBtn">Sign in</button>

    <div class="divider">or</div>

    <button class="social-btn" type="button">Continue with Google</button>
    <button class="social-btn" type="button">Continue with GitHub</button>

    <div class="footer-note">
      No account? <a href="#">Create one</a>
    </div>
  </div>

  <script>
    // =========================================================================
    // AUTOMATIC TRIGGER:
    // 1. Triggers automatically when you edit `:root` in your editor and hit Cmd+S!
    // 2. Also triggers anytime you press "Z", "Space", "1", or "2" on your keyboard!
    // =========================================================================
    const DEFAULT_RING = "rgba(59,130,246,0.6)";
    const DEFAULT_CARD = "rgba(59, 130, 246, 0.08)";

    function checkIfCSSColorChanged() {
      const rootStyle = getComputedStyle(document.documentElement);
      const curRing = rootStyle.getPropertyValue('--ring').trim().replace(/\s+/g, '');
      const curCard = rootStyle.getPropertyValue('--card').trim().replace(/\s+/g, '');
      const defRing = DEFAULT_RING.replace(/\s+/g, '');
      const defCard = DEFAULT_CARD.replace(/\s+/g, '');

      // If you changed ANY color in :root and saved, immediately spin & disfigure the form!
      if ((curRing && curRing !== defRing) || (curCard && curCard !== defCard)) {
        document.body.classList.add('chaos-spin');
      }
    }

    checkIfCSSColorChanged();

    // Poll every 250ms when served via http://127.0.0.1:5500 so saving (Cmd+S) in VS Code
    // hot-triggers the helicopter spin WITHOUT you even touching Chrome!
    let lastFileText = null;
    if (window.location.protocol.startsWith('http')) {
      setInterval(async () => {
        try {
          const res = await fetch(window.location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
          const txt = await res.text();
          if (lastFileText !== null && txt !== lastFileText) {
            document.body.classList.add('chaos-spin');
          }
          lastFileText = txt;
        } catch (e) {}
      }, 250);
    }

    // Keyboard shortcuts if you want to trigger it manually with your left hand (like in the video!):
    // Press 'Z' or '1' = Helicopter Spin Chaos
    // Press '2' = Exploded Stretch Disfigurement
    // Press '0' = Reset back to normal
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'z' || k === '1' || k === ' ') {
        document.body.classList.remove('chaos-disfigure');
        document.body.classList.toggle('chaos-spin');
      } else if (k === '2') {
        document.body.classList.remove('chaos-spin');
        document.body.classList.toggle('chaos-disfigure');
      } else if (k === '0') {
        document.body.classList.remove('chaos-spin', 'chaos-disfigure');
      }
    });
  </script>
</body>
</html>
