<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porsche Taycan EV Control — Daily Web UI #01</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #1a1d26 0%, #090a0f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      overflow: hidden;
      transition: background 0.6s ease;
    }

    /* Ambient Studio Backdrop Glow */
    .ambient-bloom {
      position: fixed;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(56, 189, 248, 0.14) 0%,
        rgba(59, 130, 246, 0.06) 45%,
        transparent 70%
      );
      filter: blur(32px);
      pointer-events: none;
      transition: background 0.6s ease, transform 0.6s ease;
      z-index: 0;
    }

    body.climate-warm .ambient-bloom {
      background: radial-gradient(
        circle,
        rgba(251, 146, 60, 0.22) 0%,
        rgba(239, 68, 68, 0.08) 45%,
        transparent 70%
      );
    }

    body.charging-active .ambient-bloom {
      background: radial-gradient(
        circle,
        rgba(52, 211, 153, 0.24) 0%,
        rgba(16, 185, 129, 0.08) 45%,
        transparent 70%
      );
    }

    /* Outer iPhone 16 Pro Titanium Frame */
    .iphone-frame {
      position: relative;
      width: 360px;
      height: 744px;
      border-radius: 58px;
      padding: 11px;
      background: linear-gradient(145deg, #5a5a62 0%, #2b2b2f 48%, #47474e 100%);
      box-shadow:
        0 32px 75px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 0 0 2px #121215;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease;
      z-index: 2;
    }

    .iphone-frame.taptic-bump {
      transform: scale(0.992);
    }

    /* Hardware Side Buttons */
    .hw-btn {
      position: absolute;
      background: linear-gradient(180deg, #4b4b50, #2a2a2e);
      border-radius: 2px;
      box-shadow: 0 0 1px rgba(255, 255, 255, 0.25) inset;
    }
    .hw-action { left: -3px; top: 132px; width: 3px; height: 28px; }
    .hw-vol-up { left: -3px; top: 180px; width: 3px; height: 52px; }
    .hw-vol-down { left: -3px; top: 244px; width: 3px; height: 52px; }
    .hw-power { right: -3px; top: 200px; width: 3px; height: 78px; }

    .iphone-bezel {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 48px;
      padding: 3px;
      overflow: hidden;
    }

    /* Screen Area */
    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 45px;
      background: linear-gradient(180deg, #11131a 0%, #0b0d12 52%, #08090d 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    /* Status Bar & Dynamic Island */
    .status-bar {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 10px 24px 0;
      z-index: 50;
      color: #ffffff;
    }

    .status-time {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      width: 54px;
    }

    .dynamic-island {
      position: relative;
      width: 102px;
      height: 27px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: all 0.38s cubic-bezier(0.22, 1.25, 0.36, 1);
      overflow: hidden;
    }

    .dynamic-island.expanded {
      width: 186px;
      height: 30px;
      padding: 0 12px;
    }

    .island-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 600;
      color: #38bdf8;
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .dynamic-island.expanded .island-status {
      opacity: 1;
      transform: translateX(0);
    }

    .island-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .island-camera {
      margin-left: auto;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e2846 0%, #080b14 60%, #050505 100%);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 54px;
      justify-content: flex-end;
    }

    .status-icons svg {
      height: 11px;
      fill: currentColor;
    }

    /* App Top Header */
    .app-header {
      padding: 10px 22px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .car-brand-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .car-subtitle {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #94a3b8;
    }

    .car-model-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }

    .profile-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .profile-btn:active {
      transform: scale(0.92);
    }

    /* Quick Telemetry Strip (Battery / Range / Temp) */
    .telemetry-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 8px 22px;
      z-index: 10;
    }

    .telemetry-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      backdrop-filter: blur(10px);
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .telemetry-pill.highlight {
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(52, 211, 153, 0.08);
    }

    .tele-label {
      font-size: 10.5px;
      font-weight: 500;
      color: #64748b;
    }

    .tele-val {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .tele-val span {
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
    }

    /* Center Interactive Top-Down EV Stage */
    .car-stage {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Ambient Floor Halo Under Car */
    .car-floor-halo {
      position: absolute;
      width: 190px;
      height: 330px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(56, 189, 248, 0.18) 0%,
        rgba(56, 189, 248, 0.04) 55%,
        transparent 75%
      );
      filter: blur(14px);
      transition: all 0.5s ease;
      pointer-events: none;
    }

    .iphone-screen.unlocked .car-floor-halo {
      background: radial-gradient(
        ellipse at center,
        rgba(56, 189, 248, 0.32) 0%,
        rgba(59, 130, 246, 0.1) 58%,
        transparent 78%
      );
    }

    .iphone-screen.climate-mode .car-floor-halo {
      background: radial-gradient(
        ellipse at center,
        rgba(251, 146, 60, 0.34) 0%,
        rgba(239, 68, 68, 0.12) 58%,
        transparent 78%
      );
    }

    .iphone-screen.charging-mode .car-floor-halo {
      background: radial-gradient(
        ellipse at center,
        rgba(52, 211, 153, 0.36) 0%,
        rgba(16, 185, 129, 0.12) 58%,
        transparent 78%
      );
    }

    /* LED Matrix Headlight Beams (Top of Car) */
    .headlight-beams {
      position: absolute;
      top: -18px;
      width: 170px;
      height: 110px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scaleY(0.85);
      transition: opacity 0.35s ease, transform 0.4s ease;
      display: flex;
      justify-content: space-between;
      padding: 0 22px;
    }

    .iphone-screen.unlocked .headlight-beams {
      opacity: 1;
      transform: translateY(0) scaleY(1);
    }

    .headlight-flash .headlight-beams {
      opacity: 1 !important;
      filter: brightness(1.8);
    }

    .beam-cone {
      width: 44px;
      height: 95px;
      background: linear-gradient(
        0deg,
        rgba(224, 242, 254, 0.65) 0%,
        rgba(56, 189, 248, 0.22) 45%,
        transparent 100%
      );
      clip-path: polygon(28% 100%, 72% 100%, 100% 0%, 0% 0%);
      filter: blur(4px);
    }

    /* Red Taillight Strip Glow (Bottom of Car) */
    .taillight-glow {
      position: absolute;
      bottom: 20px;
      width: 118px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.85) 0%, transparent 72%);
      filter: blur(6px);
      opacity: 0.2;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .iphone-screen.unlocked .taillight-glow,
    .headlight-flash .taillight-glow {
      opacity: 0.95;
    }

    /* Top-Down Luxury EV SVG Vector Illustration */
    .ev-car-svg {
      position: relative;
      width: 152px;
      height: 310px;
      z-index: 3;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.75));
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Animated Frunk, Trunk, Mirrors & Cabin Glow inside SVG */
    #svgFrunkHood {
      transform-origin: 76px 86px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .frunk-open #svgFrunkHood {
      transform: translateY(-6px) scaleY(0.93);
    }

    #svgTrunkLid {
      transform-origin: 76px 245px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .trunk-open #svgTrunkLid {
      transform: translateY(6px) scaleY(0.93);
    }

    .side-mirror-left,
    .side-mirror-right {
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .iphone-screen:not(.unlocked) .side-mirror-left {
      transform: translateX(5px) rotate(-22deg);
      transform-origin: 20px 108px;
    }
    .iphone-screen:not(.unlocked) .side-mirror-right {
      transform: translateX(-5px) rotate(22deg);
      transform-origin: 132px 108px;
    }

    /* Interior Cabin Thermal Overlay */
    #cabinThermalGlow {
      opacity: 0;
      transition: opacity 0.45s ease, fill 0.45s ease;
    }
    .iphone-screen.climate-mode #cabinThermalGlow {
      opacity: 0.55;
    }

    /* Battery Pack Cell Matrix (visible during Charging Mode) */
    #batteryPackOverlay {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .iphone-screen.charging-mode #batteryPackOverlay {
      opacity: 1;
    }

    .energy-flow-line {
      stroke-dasharray: 8 6;
      animation: energyFlow 0.7s linear infinite;
    }

    @keyframes energyFlow {
      to { stroke-dashoffset: -28; }
    }

    /* Floating Interactive Hotspot Buttons around Car */
    .hotspot-btn {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(24, 28, 38, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 8;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      transition:
        transform 0.18s cubic-bezier(0.22, 1.4, 0.36, 1),
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .hotspot-btn:hover {
      transform: scale(1.06);
    }

    .hotspot-btn:active {
      transform: scale(0.9);
    }

    .hotspot-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hotspot-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.65);
      color: #38bdf8;
      box-shadow:
        0 8px 22px rgba(56, 189, 248, 0.28),
        0 0 0 4px rgba(56, 189, 248, 0.1);
    }

    /* Hotspot Positions */
    .hotspot-left-door { left: 24px; top: 50%; transform: translateY(-50%); }
    .hotspot-left-door:hover { transform: translateY(-50%) scale(1.06); }
    .hotspot-left-door:active { transform: translateY(-50%) scale(0.9); }

    .hotspot-right-door { right: 24px; top: 50%; transform: translateY(-50%); }
    .hotspot-right-door:hover { transform: translateY(-50%) scale(1.06); }
    .hotspot-right-door:active { transform: translateY(-50%) scale(0.9); }

    .hotspot-frunk { left: 28px; top: 28px; width: 38px; height: 38px; font-size: 10px; font-weight: 700; }
    .hotspot-trunk { right: 28px; bottom: 26px; width: 38px; height: 38px; font-size: 10px; font-weight: 700; }

    /* Bottom Control Bento Grid & Dock */
    .bottom-controls {
      padding: 6px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .bento-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bento-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition:
        transform 0.15s cubic-bezier(0.22, 1.4, 0.36, 1),
        background 0.25s ease,
        border-color 0.25s ease;
    }

    .bento-card:active {
      transform: scale(0.96);
    }

    .bento-card.active-climate {
      background: rgba(251, 146, 60, 0.14);
      border-color: rgba(251, 146, 60, 0.48);
    }

    .bento-card.active-charge {
      background: rgba(52, 211, 153, 0.14);
      border-color: rgba(52, 211, 153, 0.48);
    }

    .bento-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bento-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .bento-card.active-climate .bento-icon {
      background: rgba(251, 146, 60, 0.25);
      color: #fb923c;
    }

    .bento-card.active-charge .bento-icon {
      background: rgba(52, 211, 153, 0.25);
      color: #34d399;
    }

    .bento-badge {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }

    .bento-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 1px;
    }

    .bento-sub {
      font-size: 11.5px;
      color: #94a3b8;
    }

    /* Master Lock / Start Engine Pill Bar */
    .master-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(20, 23, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .dock-primary-btn {
      flex: 1;
      height: 44px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
      transition: transform 0.14s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .dock-primary-btn:active {
      transform: scale(0.96);
    }

    .dock-primary-btn.locked-state {
      background: rgba(255, 255, 255, 0.09);
      box-shadow: none;
      color: #e2e8f0;
    }

    .dock-quick-icons {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
    }

    .dock-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease, transform 0.12s ease;
    }

    .dock-icon-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .dock-icon-btn:active {
      transform: scale(0.9);
    }

    /* Slide-Up Climate Control Drawer */
    .climate-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(18, 21, 30, 0.95);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 10px 22px 26px;
      z-index: 40;
      transform: translateY(105%);
      box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.65);
      transition: transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .climate-drawer.visible {
      transform: translateY(0%);
    }

    .drawer-grabber {
      width: 38px;
      height: 4.5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.25);
      margin: 0 auto 14px;
      cursor: pointer;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .drawer-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }

    .drawer-close {
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }

    /* Interactive Temperature Dial Ring */
    .temp-dial-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 0 8px;
    }

    .temp-step-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .temp-step-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.15);
    }

    .temp-circle {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 146, 60, 0.18) 0%, rgba(255, 255, 255, 0.03) 70%);
      border: 2.5px solid #fb923c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(251, 146, 60, 0.28);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .temp-circle.cool {
      border-color: #38bdf8;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(255, 255, 255, 0.03) 70%);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.28);
    }

    .temp-big-num {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .temp-mode-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .fan-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fan-pill {
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;

  <script>
    const iphoneFrame = document.getElementById('iphoneFrame');
    const iphoneScreen = document.getElementById('iphoneScreen');
    const dynamicIsland = document.getElementById('dynamicIsland');
    const islandStatus = document.getElementById('islandStatus');
    const islandText = document.getElementById('islandText');
    const headerDot = document.getElementById('headerDot');
    const parkStatusText = document.getElementById('parkStatusText');

    const batteryTelePill = document.getElementById('batteryTelePill');
    const batteryReadout = document.getElementById('batteryReadout');
    const rangeReadout = document.getElementById('rangeReadout');
    const cabinReadout = document.getElementById('cabinReadout');

    const carStage = document.getElementById('carStage');
    const frunkBtn = document.getElementById('frunkBtn');
    const trunkBtn = document.getElementById('trunkBtn');
    const leftDoorBtn = document.getElementById('leftDoorBtn');
    const rightDoorBtn = document.getElementById('rightDoorBtn');
    const masterLockBtn = document.getElementById('masterLockBtn');
    const masterLockText = document.getElementById('masterLockText');
    const hornBtn = document.getElementById('hornBtn');
    const flashLightsBtn = document.getElementById('flashLightsBtn');

    const climateCard = document.getElementById('climateCard');
    const climateCardTitle = document.getElementById('climateCardTitle');
    const climateDrawer = document.getElementById('climateDrawer');
    const closeClimateBtn = document.getElementById('closeClimateBtn');
    const closeDrawerGrabber = document.getElementById('closeDrawerGrabber');
    const tempDownBtn = document.getElementById('tempDownBtn');
    const tempUpBtn = document.getElementById('tempUpBtn');
    const tempCircle = document.getElementById('tempCircle');
    const tempBigNum = document.getElementById('tempBigNum');
    const tempModeTag = document.getElementById('tempModeTag');
    const fanPills = document.querySelectorAll('.fan-pill');

    const chargeCard = document.getElementById('chargeCard');
    const chargeCardTitle = document.getElementById('chargeCardTitle');
    const chargeCardSub = document.getElementById('chargeCardSub');

    let isUnlocked = true;
    let isFrunkOpen = false;
    let isTrunkOpen = false;
    let isCharging = false;
    let cabinTemp = 21.5;
    let batteryLevel = 84;
    let chargeInterval = null;

    /* ==========================================================================
       Luxury Automotive Web Audio Synthesizer
       ========================================================================== */
    const CarAudio = (() => {
      let ctx = null;
      function getCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function bump() {
        iphoneFrame.classList.remove('taptic-bump');
        void iphoneFrame.offsetWidth;
        iphoneFrame.classList.add('taptic-bump');
        setTimeout(() => iphoneFrame.classList.remove('taptic-bump'), 110);
      }

      // Luxury Car Double-Chirp Lock / Unlock Sound
      function playCarChirp(unlock = true) {
        try {
          bump();
          const c = getCtx();
          const now = c.currentTime;
          const pulses = unlock ? [1, 2] : [1];
          pulses.forEach((_, idx) => {
            const start = now + idx * 0.11;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(unlock ? 2150 : 1780, start);
            osc.frequency.exponentialRampToValueAtTime(unlock ? 2500 : 1450, start + 0.065);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.linearRampToValueAtTime(0.11, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.075);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(start);
            osc.stop(start + 0.08);
          });
        } catch (e) {}
      }

      // Hydraulic Latch Sound for Frunk / Trunk
      function playLatch(open = true) {
        try {
          bump();
          const c = getCtx();
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(open ? 180 : 320, now);
          osc.frequency.exponentialRampToValueAtTime(open ? 420 : 110, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        } catch (e) {}
      }

      // Soft UI Tick for Climate Dial
      function playDialTick(pitch = 600) {
        try {
          bump();
          const c = getCtx();
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(pitch, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } catch (e) {}
      }

      // Futuristic EV Supercharger Power-Up Chord
      function playSuperchargeStart() {
        try {
          bump();
          const c = getCtx();
          const now = c.currentTime;
          [329.63, 440, 659.25, 880].forEach((f, idx) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            const start = now + idx * 0.055;
            osc.frequency.setValueAtTime(f, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(0.06, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(start);
            osc.stop(start + 0.36);
          });
        } catch (e) {}
      }

      return { playCarChirp, playLatch, playDialTick, playSuperchargeStart };
    })();

    /* ==========================================================================
       Interactive Vehicle Controls
       ========================================================================== */
    function flashHeadlights() {
      carStage.classList.add('headlight-flash');
      setTimeout(() => carStage.classList.remove('headlight-flash'), 220);
      setTimeout(() => carStage.classList.add('headlight-flash'), 340);
      setTimeout(() => carStage.classList.remove('headlight-flash'), 540);
    }

    function toggleVehicleLock() {
      isUnlocked = !isUnlocked;
      CarAudio.playCarChirp(isUnlocked);
      flashHeadlights();

      if (isUnlocked) {
        iphoneScreen.classList.add('unlocked');
        leftDoorBtn.classList.add('active');
        rightDoorBtn.classList.add('active');
        masterLockBtn.classList.remove('locked-state');
        masterLockText.textContent = 'Vehicle Unlocked';
        islandText.textContent = 'Unlocked • Ready';
        islandStatus.style.color = '#38bdf8';
        headerDot.style.background = '#34d399';
      } else {
        iphoneScreen.classList.remove('unlocked');
        leftDoorBtn.classList.remove('active');
        rightDoorBtn.classList.remove('active');
        masterLockBtn.classList.add('locked-state');
        masterLockText.textContent = 'Vehicle Locked';
        islandText.textContent = 'Sentry Armed • Locked';
        islandStatus.style.color = '#f87171';
        headerDot.style.background = '#f87171';
      }
    }

    leftDoorBtn.addEventListener('click', toggleVehicleLock);
    rightDoorBtn.addEventListener('click', toggleVehicleLock);
    masterLockBtn.addEventListener('click', toggleVehicleLock);

    hornBtn.addEventListener('click', () => {
      CarAudio.playCarChirp(true);
      flashHeadlights();
    });
    flashLightsBtn.addEventListener('click', () => {
      CarAudio.playCarChirp(true);
      flashHeadlights();
    });

    // Frunk & Trunk Toggles
    frunkBtn.addEventListener('click', () => {
      isFrunkOpen = !isFrunkOpen;
      CarAudio.playLatch(isFrunkOpen);
      frunkBtn.classList.toggle('active', isFrunkOpen);
      carStage.classList.toggle('frunk-open', isFrunkOpen);
      islandText.textContent = isFrunkOpen ? 'Frunk Open' : 'Frunk Closed';
    });

    trunkBtn.addEventListener('click', () => {
      isTrunkOpen = !isTrunkOpen;
      CarAudio.playLatch(isTrunkOpen);
      trunkBtn.classList.toggle('active', isTrunkOpen);
      carStage.classList.toggle('trunk-open', isTrunkOpen);
      islandText.textContent = isTrunkOpen ? 'Trunk Open' : 'Trunk Closed';
    });

    // Climate Drawer & Temperature Control
    function updateClimateUI() {
      const formatted = cabinTemp.toFixed(1);
      tempBigNum.textContent = `${formatted}°`;
      cabinReadout.innerHTML = `${formatted}<span>°C</span>`;
      climateCardTitle.textContent = `Climate • ${formatted}°C`;

      if (cabinTemp <= 19.5) {
        tempCircle.classList.add('cool');
        tempModeTag.textContent = 'Max Cool';
        document.body.classList.remove('climate-warm');
      } else if (cabinTemp >= 24.0) {
        tempCircle.classList.remove('cool');
        tempModeTag.textContent = 'Warm Cabin';
        document.body.classList.add('climate-warm');
      } else {
        tempCircle.classList.remove('cool');
        tempModeTag.textContent = 'Auto Comfort';
        document.body.classList.remove('climate-warm');
      }
    }

    climateCard.addEventListener('click', () => {
      CarAudio.playDialTick(520);
      climateDrawer.classList.add('visible');
      climateCard.classList.add('active-climate');
      iphoneScreen.classList.add('climate-mode');
      islandText.textContent = `Climate Active • ${cabinTemp.toFixed(1)}°C`;
    });

    function closeClimateDrawer() {
      CarAudio.playDialTick(380);
      climateDrawer.classList.remove('visible');
    }

    closeClimateBtn.addEventListener('click', closeClimateDrawer);
    closeDrawerGrabber.addEventListener('click', closeClimateDrawer);

    tempDownBtn.addEventListener('click', () => {
      cabinTemp = Math.max(16.0, cabinTemp - 0.5);
      CarAudio.playDialTick(420 + (cabinTemp - 16) * 25);
      updateClimateUI();
    });

    tempUpBtn.addEventListener('click', () => {
      cabinTemp = Math.min(29.0, cabinTemp + 0.5);
      CarAudio.playDialTick(420 + (cabinTemp - 16) * 25);
      updateClimateUI();
    });

    fanPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        fanPills.forEach((p) => p.classList.remove('active'));
        pill.classList.add('active');
        cabinTemp = parseFloat(pill.dataset.preset);
        CarAudio.playDialTick(680);
        updateClimateUI();
      });
    });

    // Supercharging Live Mode
    chargeCard.addEventListener('click', () => {
      isCharging = !isCharging;
      chargeCard.classList.toggle('active-charge', isCharging);
      iphoneScreen.classList.toggle('charging-mode', isCharging);
      document.body.classList.toggle('charging-active', isCharging);
      batteryTelePill.classList.toggle('highlight', isCharging);

      if (isCharging) {
        CarAudio.playSuperchargeStart();
        chargeCardTitle.textContent = 'Supercharging...';
        islandText.textContent = '⚡ 250 kW Supercharging';
        islandStatus.style.color = '#34d399';

        chargeInterval = setInterval(() => {
          if (batteryLevel < 100) {
            batteryLevel += 1;
            const miles = Math.round(batteryLevel * 3.52);
            batteryReadout.innerHTML = `${batteryLevel}<span>%</span>`;
            rangeReadout.innerHTML = `${miles} <span>mi</span>`;
            chargeCardSub.textContent = `${batteryLevel}% • 14 mins to full`;
          }
        }, 700);
      } else {
        CarAudio.playDialTick(340);
        if (chargeInterval) clearInterval(chargeInterval);
        chargeCardTitle.textContent = 'Supercharge';
        chargeCardSub.textContent = `${batteryLevel}% • Tap to boost`;
        islandText.textContent = 'Unlocked • Ready';
        islandStatus.style.color = '#38bdf8';
      }
    });
  </script>
</body>
</html>
