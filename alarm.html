<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alarm App - Apple in 2030</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1c191f 0%, #09090c 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
      transition: background 0.6s ease;
    }

    body.alarm-ringing {
      background: radial-gradient(circle at 50% 50%, #2d1d14 0%, #120d0e 60%, #08080a 100%);
    }

    body.snoozing-peace {
      background: radial-gradient(circle at 50% 50%, #131c2e 0%, #090c14 65%, #050608 100%);
    }

    /* Ambient Orange/Amber Pulse Behind Phone while Alarm Rings */
    .ambient-bloom {
      position: fixed;
      width: 660px;
      height: 660px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 149, 0, 0.26) 0%,
        rgba(255, 59, 48, 0.1) 42%,
        transparent 70%
      );
      filter: blur(28px);
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease, background 0.6s ease;
      z-index: 0;
    }

    body.alarm-ringing .ambient-bloom {
      opacity: 1;
      animation: alarmBloomPulse 1.1s ease-in-out infinite alternate;
    }

    body.snoozing-peace .ambient-bloom {
      opacity: 0.65;
      background: radial-gradient(
        circle,
        rgba(94, 92, 230, 0.22) 0%,
        rgba(50, 173, 230, 0.08) 45%,
        transparent 70%
      );
      animation: none;
      transform: scale(1);
    }

    @keyframes alarmBloomPulse {
      0% { transform: scale(0.88); opacity: 0.65; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* Outer iPhone Titanium Chassis */
    .iphone-frame {
      position: relative;
      width: 354px;
      height: 728px;
      border-radius: 58px;
      padding: 11px;
      background: linear-gradient(145deg, #5a5a60 0%, #2d2d30 48%, #47474d 100%);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.82),
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 0 0 2px #141416;
      transition:
        box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
    }

    .iphone-frame.ringing-glow {
      box-shadow:
        0 30px 75px rgba(0, 0, 0, 0.78),
        0 0 85px rgba(255, 149, 0, 0.32),
        0 0 0 1px rgba(255, 180, 110, 0.24) inset,
        0 0 0 2px #141416;
    }

    /* Subtle Vibration while ringing (pauses when modal/sheet is open so UI is easy to click) */
    .iphone-frame.vibrating {
      animation: phoneVibrate 1s ease-in-out infinite;
    }

    @keyframes phoneVibrate {
      0%, 65%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      70% { transform: translate3d(-1.5px, 0.5px, 0) rotate(-0.25deg); }
      75% { transform: translate3d(1.5px, -0.5px, 0) rotate(0.25deg); }
      80% { transform: translate3d(-1.5px, -0.5px, 0) rotate(-0.2deg); }
      85% { transform: translate3d(1.5px, 0.5px, 0) rotate(0.2deg); }
      90% { transform: translate3d(-1px, 0, 0) rotate(-0.1deg); }
    }

    .iphone-frame.taptic-bump {
      transform: scale(0.992) !important;
    }

    /* Hardware Side Buttons */
    .hw-btn {
      position: absolute;
      background: linear-gradient(180deg, #4b4b50, #2a2a2e);
      border-radius: 2px;
      box-shadow: 0 0 1px rgba(255, 255, 255, 0.25) inset;
    }
    .hw-action {
      left: -3px;
      top: 132px;
      width: 3px;
      height: 28px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }
    .hw-vol-up {
      left: -3px;
      top: 180px;
      width: 3px;
      height: 52px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }
    .hw-vol-down {
      left: -3px;
      top: 244px;
      width: 3px;
      height: 52px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }
    .hw-power {
      right: -3px;
      top: 200px;
      width: 3px;
      height: 78px;
      border-top-right-radius: 3px;
      border-bottom-right-radius: 3px;
    }

    /* Inner Black Hardware Bezel */
    .iphone-bezel {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 48px;
      padding: 3px;
      overflow: hidden;
    }

    .earpiece-slit {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 3px;
      border-radius: 2px;
      background: #141416;
      z-index: 30;
    }

    /* Screen Area */
    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 45px;
      background: radial-gradient(circle at 50% 35%, #231610 0%, #0d0a0c 55%, #050506 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.55s ease;
    }

    .iphone-screen.snoozed {
      background: radial-gradient(circle at 50% 30%, #172038 0%, #0b0e18 58%, #050609 100%);
    }

    /* Ambient Orange Radial Pulse inside Lock Screen */
    .screen-radial-pulse {
      position: absolute;
      top: 45%;
      left: 50%;
      width: 320px;
      height: 320px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 149, 0, 0.22) 0%, rgba(255, 149, 0, 0.05) 55%, transparent 72%);
      pointer-events: none;
      transition: opacity 0.45s ease;
      animation: innerGlowPulse 1.1s ease-in-out infinite alternate;
      z-index: 0;
    }

    .iphone-screen.snoozed .screen-radial-pulse {
      opacity: 0;
      animation: none;
    }

    @keyframes innerGlowPulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
    }

    /* Persistent Status Bar & Dynamic Island */
    .status-bar {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 24px;
      z-index: 45;
      color: #ffffff;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      width: 58px;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: relative;
      width: 158px;
      height: 29px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition:
        width 0.38s cubic-bezier(0.22, 1.25, 0.36, 1),
        height 0.38s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    .dynamic-island.compact {
      width: 96px;
      height: 27px;
    }

    .island-alarm-left {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ff9f0a;
      font-size: 11px;
      font-weight: 600;
      transition: opacity 0.25s ease;
    }

    .dynamic-island.compact .island-alarm-left,
    .dynamic-island.compact .island-wave {
      opacity: 0;
      pointer-events: none;
    }

    .island-alarm-left svg {
      width: 13px;
      height: 13px;
      fill: #ff9f0a;
      animation: bellWiggle 0.45s ease-in-out infinite alternate;
    }

    @keyframes bellWiggle {
      0% { transform: rotate(-14deg); }
      100% { transform: rotate(14deg); }
    }

    /* Animated Equalizer Bars in Dynamic Island */
    .island-wave {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 12px;
      margin-left: auto;
      margin-right: 6px;
    }

    .wave-bar {
      width: 2px;
      background: #ff9f0a;
      border-radius: 2px;
      animation: waveBounce 0.55s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(1) { height: 5px; animation-delay: 0.0s; }
    .wave-bar:nth-child(2) { height: 11px; animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { height: 7px; animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { height: 10px; animation-delay: 0.1s; }

    @keyframes waveBounce {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.1); }
    }

    .island-camera {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e2846 0%, #080b14 60%, #050505 100%);
      box-shadow: 0 0 1px rgba(255, 255, 255, 0.18) inset;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 58px;
      justify-content: flex-end;
    }

    .status-icons svg {
      height: 11px;
      fill: currentColor;
    }

    /* Main Lock Screen Content (blurs when modal/sheet is active) */
    .screen-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 64px 24px 28px;
      transition: filter 0.38s ease, transform 0.38s ease;
      z-index: 2;
    }

    .iphone-screen.blurred .screen-content {
      filter: blur(10px);
    }

    /* Lock Screen Clock & Date Header */
    .clock-header {
      text-align: center;
      margin-top: 12px;
    }

    .lock-icon-row {
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.75);
    }

    .lock-icon-row svg {
      width: 13px;
      height: 16px;
      fill: currentColor;
    }

    .lock-date {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      letter-spacing: -0.2px;
      margin-bottom: -2px;
    }

    .lock-time {
      font-size: 84px;
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -3px;
      color: rgba(255, 255, 255, 0.96);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    /* Center Alarm Label & Controls */
    .alarm-center-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 18px;
      margin-top: 10px;
    }

    .alarm-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .alarm-badge svg {
      width: 20px;
      height: 20px;
      fill: #ff9f0a;
    }

    /* Big iOS Orange Snooze Pill Button */
    .snooze-btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .snooze-pulse-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50px;
      border: 2px solid rgba(255, 159, 10, 0.45);
      animation: snoozeRipple 1.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }

    @keyframes snoozeRipple {
      0% { transform: scale(0.94); opacity: 0.85; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .snooze-btn {
      position: relative;
      width: 224px;
      height: 64px;
      border-radius: 32px;
      border: none;
      background: linear-gradient(180deg, #ffa91f 0%, #ff9500 100%);
      color: #ffffff;
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.4px;
      font-family: inherit;
      cursor: pointer;
      box-shadow:
        0 12px 32px rgba(255, 149, 0, 0.42),
        0 1.5px 1px rgba(255, 255, 255, 0.35) inset;
      transition: transform 0.14s cubic-bezier(0.22, 1.4, 0.36, 1), box-shadow 0.2s ease;
    }

    .snooze-btn:hover {
      transform: scale(1.025);
      box-shadow:
        0 14px 36px rgba(255, 149, 0, 0.55),
        0 1.5px 1px rgba(255, 255, 255, 0.4) inset;
    }

    .snooze-btn:active {
      transform: scale(0.94);
    }

    /* Snoozing Active Countdown Pill (shown after payment completes) */
    .snoozing-status-pill {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 16px 26px;
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.18) inset;
      cursor: pointer;
      animation: fadeInScale 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .snoozing-status-pill.active {
      display: flex;
    }

    .snoozing-top {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #64d2ff;
    }

    .snoozing-timer {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.8px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .snoozing-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Bottom Stop Button & Home Bar */
    .bottom-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .stop-btn {
      width: 136px;
      height: 44px;
      border-radius: 22px;
      border: none;
      background: rgba(120, 120, 128, 0.36);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.88);
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .stop-btn:hover {
      background: rgba(120, 120, 128, 0.48);
    }

    .stop-btn:active {
      transform: scale(0.95);
    }

    .home-indicator {
      width: 120px;
      height: 4.5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.38);
    }

    /* Overlay Backdrop inside Phone */
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.24);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .overlay-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* iOS Alert Modal ("Snooze+™") */
    .ios-alert {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 278px;
      transform: translate(-50%, -50%) scale(0.84);
      background: rgba(38, 38, 42, 0.88);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-radius: 16px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 0 0.5px rgba(255, 255, 255, 0.16) inset;
      color: #ffffff;
      text-align: center;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transition:
        opacity 0.2s ease,
        transform 0.28s cubic-bezier(0.22, 1.22, 0.36, 1);
    }

    .ios-alert.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .alert-body {
      padding: 20px 18px 17px;
    }

    .alert-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .alert-message {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.38;
      letter-spacing: -0.1px;
      color: rgba(235, 235, 245, 0.9);
    }

    .alert-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 0.5px solid rgba(255, 255, 255, 0.18);
      height: 44px;
    }

    .alert-btn {
      background: transparent;
      border: none;
      color: #0a84ff;
      font-size: 16.5px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease;
    }

    .alert-btn:first-child {
      border-right: 0.5px solid rgba(255, 255, 255, 0.18);
      font-weight: 400;
    }

    .alert-btn:last-child {
      font-weight: 600;
    }

    .alert-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .alert-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Apple Pay Bottom Sheet */
    .apple-pay-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(28, 28, 30, 0.96);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 8px 18px 24px;
      color: #ffffff;
      z-index: 40;
      transform: translateY(104%);
      box-shadow:
        0 -10px 35px rgba(0, 0, 0, 0.48),
        0 0.5px 0 rgba(255, 255, 255, 0.16) inset;
      transition: transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .apple-pay-sheet.visible {
      transform: translateY(0%);
    }

    .sheet-grabber {
      width: 36px;
      height: 4.5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.28);
      margin: 0 auto 12px;
    }

    .pay-details-view.hidden {
      display: none;
    }

    .apple-pay-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 16px;
    }

    .apple-pay-header svg {
      width: 16px;
      height: 19px;
      fill: #ffffff;
      transform: translateY(-1px);
    }

    .subscription-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .sub-info-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .sub-info-desc {
      font-size: 12px;
      color: #8e8e93;
    }

    .sub-price {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #ffffff;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(58, 58, 62, 0.76);
      border-radius: 12px;
      padding: 11px 13px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .card-row:hover {
      background: rgba(72, 72, 76, 0.85);
    }

    .card-row:active {
      transform: scale(0.985);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .mastercard-logo {
      position: relative;
      width: 30px;
      height: 20px;
      display: flex;
      align-items: center;
    }

    .mc-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      position: absolute;
    }

    .mc-red {
      background: #eb001b;
      left: 0;
    }

    .mc-orange {
      background: #f79e1b;
      left: 11px;
      mix-blend-mode: screen;
      opacity: 0.92;
    }

    .card-name {
      font-size: 13.5px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 1px;
    }

    .card-number {
      font-size: 11.5px;
      color: #98989f;
      letter-spacing: 0.4px;
    }

    .card-chevron {
      color: #8e8e93;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
    }

    .pay-footer {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 23px;
      background: #007aff;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .confirm-btn:hover {
      background: #0a84ff;
    }

    .confirm-btn:active {
      transform: scale(0.975);
      background: #0062cc;
    }

    /* Face ID Scanning Indicator */
    .face-id-box {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 2px 0;
      color: #ffffff;
      transition: color 0.25s ease;
    }

    .face-id-box.active {
      display: flex;
      animation: fadeInScale 0.22s ease;
    }

    .face-id-box.verified {
      color: #30d158;
    }

    .face-id-icon-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .face-scan-laser {
      position: absolute;
      left: 3px;
      right: 3px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #64d2ff, #ffffff, #64d2ff, transparent);
      box-shadow: 0 0 8px #64d2ff;
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
    }

    .face-id-box.scanning .face-scan-laser {
      opacity: 0.95;
      animation: laserSweep 0.75s ease-in-out infinite alternate;
    }

    @keyframes laserSweep {
      0% { top: 5px; }
      100% { top: 28px; }
    }

    .face-id-icon {
      width: 34px;
      height: 34px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    .face-id-box.scanning .face-id-icon {
      animation: pulseScan 0.8s ease-in-out infinite;
    }

    .face-id-box.verified .face-id-icon {
      transform: scale(1.08);
      filter: drop-shadow(0 0 8px rgba(48, 209, 88, 0.45));
    }

    .face-id-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    /* Done Checkmark View */
    .pay-done-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 0 22px;
      gap: 10px;
      animation: fadeInScale 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pay-done-view.active {
      display: flex;
    }

    .done-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid #30d158;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #30d158;
      box-shadow: 0 0 18px rgba(48, 209, 88, 0.3);
    }

    .done-circle svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: drawCheck 0.35s 0.06s ease forwards;
    }

    .done-text {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulseScan {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.74; }
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

  <script>
    const iphoneFrame = document.getElementById('iphoneFrame');
    const iphoneScreen = document.getElementById('iphoneScreen');
    const dynamicIsland = document.getElementById('dynamicIsland');
    const snoozeBtnWrapper = document.getElementById('snoozeBtnWrapper');
    const snoozeBtn = document.getElementById('snoozeBtn');
    const stopBtn = document.getElementById('stopBtn');
    const alarmBadge = document.getElementById('alarmBadge');
    const snoozingPill = document.getElementById('snoozingPill');
    const snoozeTimer = document.getElementById('snoozeTimer');
    const overlayBackdrop = document.getElementById('overlayBackdrop');
    const proAlert = document.getElementById('proAlert');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');
    const cancelBtn = document.getElementById('cancelBtn');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const applePaySheet = document.getElementById('applePaySheet');
    const payDetailsView = document.getElementById('payDetailsView');
    const subTitle = document.getElementById('subTitle');
    const subDesc = document.getElementById('subDesc');
    const subPrice = document.getElementById('subPrice');
    const cardRow = document.getElementById('cardRow');
    const cardName = document.getElementById('cardName');
    const cardNumber = document.getElementById('cardNumber');
    const confirmFaceIdBtn = document.getElementById('confirmFaceIdBtn');
    const faceIdBox = document.getElementById('faceIdBox');
    const payDoneView = document.getElementById('payDoneView');

    let isFlowBusy = false;
    let isSnoozed = false;
    let countdownInterval = null;

    /* ==========================================================================
       Synthesized Web Audio Sound Engine (Includes iOS Radar Alarm Synth!)
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;
      let alarmLoopTimer = null;
      let isAlarmPlaying = false;
      let isAlarmMuffled = false;

      function getCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        return ctx;
      }

      function triggerTapticBump() {
        iphoneFrame.classList.remove('taptic-bump');
        void iphoneFrame.offsetWidth;
        iphoneFrame.classList.add('taptic-bump');
        setTimeout(() => iphoneFrame.classList.remove('taptic-bump'), 120);
      }

      // Iconic iOS "Radar" Alarm Burst (4 rapid marimba/synth pulses)
      function playRadarBurst() {
        if (!isAlarmPlaying) return;
        try {
          const c = getCtx();
          const now = c.currentTime;
          const baseVol = isAlarmMuffled ? 0.028 : 0.11;

          // 4 rapid pulses per burst (classic iOS alarm cadence)
          const notes = [1046.5, 1318.5, 1046.5, 1318.5]; // C6 - E6 pattern
          notes.forEach((freq, i) => {
            const start = now + i * 0.125;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = isAlarmMuffled ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(baseVol, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.105);

            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(start);
            osc.stop(start + 0.11);
          });
        } catch (e) {}
      }

      function startAlarmLoop(muffled = false) {
        isAlarmMuffled = muffled;
        if (isAlarmPlaying) return;
        isAlarmPlaying = true;
        playRadarBurst();
        alarmLoopTimer = setInterval(playRadarBurst, 1000);
      }

      function setAlarmMuffled(muffled) {
        isAlarmMuffled = muffled;
      }

      function stopAlarmLoop() {
        isAlarmPlaying = false;
        if (alarmLoopTimer) {
          clearInterval(alarmLoopTimer);
          alarmLoopTimer = null;
        }
      }

      // iOS Alert Modal Pop
      function playAlertPop() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;

          const playTone = (freq, delay, dur, vol) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + delay);
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.linearRampToValueAtTime(vol, now + delay + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now + delay);
            osc.stop(now + delay + dur + 0.01);
          };

          playTone(587.33, 0.0, 0.16, 0.12);  // D5
          playTone(880.00, 0.045, 0.24, 0.13); // A5
        } catch (e) {}
      }

      function playTap(pitch = 150) {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(pitch, now);
          osc.frequency.exponentialRampToValueAtTime(48, now + 0.03);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } catch (e) {}
      }

      function playSheetSlideUp() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;

          const bufferSize = c.sampleRate * 0.22;
          const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = c.createBufferSource();
          noise.buffer = buffer;

          const filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(1450, now + 0.2);
          filter.Q.value = 1.8;

          const gain = c.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.07, now + 0.07);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.21);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(c.destination);
          noise.start(now);
        } catch (e) {}
      }

      function playFaceIdScan() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const freqs = [660, 880, 1108.73];
          freqs.forEach((f, idx) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            const start = now + idx * 0.18;
            osc.frequency.setValueAtTime(f, start);
            osc.frequency.exponentialRampToValueAtTime(f * 1.06, start + 0.16);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(0.045, start + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.19);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(start);
            osc.stop(start + 0.2);
          });
        } catch (e) {}
      }

      function playFaceIdVerified() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1046.5, now);
          osc.frequency.setValueAtTime(1396.9, now + 0.045);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      }

      function playApplePayChime() {
        try {
          triggerTapticBump();
          const c = getCtx();
          const now = c.currentTime;

          const playBellNote = (freq, start, duration, peakGain) => {
            [
              { ratio: 1, weight: 1.0, decay: duration },
              { ratio: 2, weight: 0.32, decay: duration * 0.65 },
              { ratio: 3, weight: 0.12, decay: duration * 0.4 }
            ].forEach(({ ratio, weight, decay }) => {
              const osc = c.createOscillator();
              const gain = c.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq * ratio, start);
              gain.gain.setValueAtTime(0.0001, start);
              gain.gain.linearRampToValueAtTime(peakGain * weight, start + 0.012);
              gain.gain.exponentialRampToValueAtTime(0.0001, start + decay);
              osc.connect(gain);
              gain.connect(c.destination);
              osc.start(start);
              osc.stop(start + decay + 0.02);
            });
          };

          playBellNote(987.77, now, 0.36, 0.18);          // B5
          playBellNote(1318.51, now + 0.115, 0.85, 0.22); // E6
        } catch (e) {}
      }

      // Peaceful Sleep Chord when Snooze finally activates
      function playSleepReliefChord() {
        try {
          const c = getCtx();
          const now = c.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            gain.gain.setValueAtTime(0.0001, now + i * 0.05);
            gain.gain.linearRampToValueAtTime(0.045, now + i * 0.05 + 0.06);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + 0.8);
          });
        } catch (e) {}
      }

      return {
        startAlarmLoop,
        setAlarmMuffled,
        stopAlarmLoop,
        playAlertPop,
        playTap,
        playSheetSlideUp,
        playFaceIdScan,
        playFaceIdVerified,
        playApplePayChime,
        playSleepReliefChord
      };
    })();

    /* ==========================================================================
       Interactive Alarm Flow
       ========================================================================== */
    const cards = [
      { name: 'Mastercard', number: '•••• 8924' },
      { name: 'Apple Sleep+ Card', number: '•••• 2030' },
      { name: 'Kidney Pay™', number: '•••• 0001' }
    ];
    let currentCardIdx = 0;

    cardRow.addEventListener('click', () => {
      if (isFlowBusy) return;
      SoundFX.playTap(180);
      currentCardIdx = (currentCardIdx + 1) % cards.length;
      cardName.textContent = cards[currentCardIdx].name;
      cardNumber.textContent = cards[currentCardIdx].number;
    });

    // Clicking Dynamic Island toggles the audible Radar alarm loop prior to pressing Snooze
    dynamicIsland.addEventListener('click', () => {
      if (!isSnoozed) {
        SoundFX.startAlarmLoop(false);
      }
    });

    function openPaywallAlert({ title, message, itemTitle, itemDesc, price }) {
      alertTitle.textContent = title;
      alertMessage.textContent = message;
      subTitle.textContent = itemTitle;
      subDesc.textContent = itemDesc;
      subPrice.textContent = price;

      // Pause chassis vibration while modal is open so user can easily click buttons
      iphoneFrame.classList.remove('vibrating');
      iphoneScreen.classList.add('blurred');
      overlayBackdrop.classList.add('active');
      proAlert.classList.add('visible');

      SoundFX.startAlarmLoop(true); // Muffled alarm continues in background
      SoundFX.playAlertPop();
    }

    // Clicking "Snooze" Button
    snoozeBtn.addEventListener('click', () => {
      if (isFlowBusy || isSnoozed) return;
      openPaywallAlert({
        title: 'Snooze+™',
        message: 'Snoozing the alarm requires a Premium Subscription. Please complete the purchase to continue sleeping.',
        itemTitle: 'Snooze+™ (9 Mins)',
        itemDesc: 'Premium Sleep Extension',
        price: '$14.99'
      });
    });

    // Clicking "Stop" Button also triggers a paywall!
    stopBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      if (isSnoozed) {
        resetToRingingAlarm();
        return;
      }
      openPaywallAlert({
        title: 'Alarm Pro™',
        message: 'Turning off the alarm requires a Premium Subscription. Please complete the purchase to silence alarm.',
        itemTitle: 'Alarm Pro™',
        itemDesc: 'Silence Alarm Pass',
        price: '$19.99'
      });
    });

    // Cancel Button: dismisses modal, alarm goes right back to full-volume ringing!
    cancelBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      SoundFX.playTap(110);
      proAlert.classList.remove('visible');
      iphoneScreen.classList.remove('blurred');
      overlayBackdrop.classList.remove('active');
      iphoneFrame.classList.add('vibrating');
      SoundFX.setAlarmMuffled(false);
    });

    // Subscribe Button: transitions from Alert to Apple Pay Sheet
    subscribeBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      SoundFX.playTap(170);
      proAlert.classList.remove('visible');

      payDetailsView.classList.remove('hidden');
      confirmFaceIdBtn.style.display = 'block';
      faceIdBox.classList.remove('active', 'scanning', 'verified');
      payDoneView.classList.remove('active');

      setTimeout(() => {
        applePaySheet.classList.add('visible');
        SoundFX.playSheetSlideUp();
      }, 120);
    });

    // Confirm with Face ID Flow
    confirmFaceIdBtn.addEventListener('click', () => {
      if (isFlowBusy) return;
      isFlowBusy = true;

      // Step 1: Show white scanning Face ID icon + biometric laser
      confirmFaceIdBtn.style.display = 'none';
      faceIdBox.classList.add('active', 'scanning');
      SoundFX.playFaceIdScan();

      // Step 2: Turn Face ID icon green ("verified")
      setTimeout(() => {
        faceIdBox.classList.remove('scanning');
        faceIdBox.classList.add('verified');
        SoundFX.playFaceIdVerified();
      }, 950);

      // Step 3: Show green checkmark "Done" screen + stop alarm + play Apple Pay Ding!
      setTimeout(() => {
        SoundFX.stopAlarmLoop();
        payDetailsView.classList.add('hidden');
        payDoneView.classList.add('active');
        SoundFX.playApplePayChime();
      }, 1650);

      // Step 4: Dismiss Apple Pay sheet & transition to peaceful Snoozing state
      setTimeout(() => {
        applePaySheet.classList.remove('visible');
        iphoneScreen.classList.remove('blurred');
        overlayBackdrop.classList.remove('active');
        enterSnoozingState();
        isFlowBusy = false;
      }, 2800);
    });

    function enterSnoozingState() {
      isSnoozed = true;
      SoundFX.stopAlarmLoop();
      SoundFX.playSleepReliefChord();

      document.body.classList.remove('alarm-ringing');
      document.body.classList.add('snoozing-peace');
      iphoneFrame.classList.remove('ringing-glow', 'vibrating');
      iphoneScreen.classList.add('snoozed');
      dynamicIsland.classList.add('compact');

      snoozeBtnWrapper.style.display = 'none';
      alarmBadge.style.display = 'none';
      snoozingPill.classList.add('active');
      stopBtn.textContent = 'Ring Again';

      let secondsLeft = 9 * 60 - 1;
      snoozeTimer.textContent = '08:59';
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        secondsLeft = Math.max(0, secondsLeft - 1);
        const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const secs = String(secondsLeft % 60).padStart(2, '0');
        snoozeTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function resetToRingingAlarm() {
      isSnoozed = false;
      if (countdownInterval) clearInterval(countdownInterval);

      document.body.classList.remove('snoozing-peace');
      document.body.classList.add('alarm-ringing');
      iphoneFrame.classList.add('ringing-glow', 'vibrating');
      iphoneScreen.classList.remove('snoozed');
      dynamicIsland.classList.remove('compact');

      snoozingPill.classList.remove('active');
      snoozeBtnWrapper.style.display = 'flex';
      alarmBadge.style.display = 'flex';
      stopBtn.textContent = 'Stop';

      SoundFX.startAlarmLoop(false);
    }

    snoozingPill.addEventListener('click', resetToRingingAlarm);
  </script>
</body>
</html>
